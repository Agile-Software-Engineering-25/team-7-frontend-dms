name: Code Quality Checks

on:
  push:
    branches: ['**'] # Run on all branches
  pull_request:
    branches: [main] # Run on PRs targeting main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Check for spec files
        id: check_specs
        run: |
          if find cypress/e2e -name "*.cy.{js,jsx,ts,tsx}" 2>/dev/null | grep -q .; then
            echo "specs_exist=true" >> $GITHUB_OUTPUT
          else
            echo "specs_exist=false" >> $GITHUB_OUTPUT
          fi

      - name: Clear shared components dir
        if: steps.check_specs.outputs.specs_exist == 'true'
        run: |
          rm -rf ./shared-components/*
          rm -rf ./shared-components/.[!.]* ./shared-components/..?* || true

      - name: Setup Shared Components
        run: npm run init

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run ci
